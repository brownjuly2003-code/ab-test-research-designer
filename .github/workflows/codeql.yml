name: CodeQL

# Static analysis for the two shipped languages. PRs and main pushes get the
# default query suite; the weekly run catches newly released queries against
# an unchanged codebase.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1"

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Code scanning lives on the public repository. This workflow also runs on the
    # private `ab-evidence` mirror, where the analysis completes but the upload
    # fails with "Code scanning is not enabled for this repository" and reddens
    # every push to main. Enabling it there needs GitHub Advanced Security, a paid
    # add-on for private repositories, so the job is scoped to the repository that
    # can actually receive the results rather than run to a guaranteed 403.
    if: github.repository == 'brownjuly2003-code/ab-test-research-designer'
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: "/language:${{ matrix.language }}"
