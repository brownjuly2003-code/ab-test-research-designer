[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trialmark"
# 0.1.0 is the distribution version, intentionally not equal to product AB_APP_VERSION
# (app/backend/app/config.py:300, currently 1.3.1). Nothing in code reads importlib.metadata.
version = "0.1.0"
description = "Experimental evidence layer on top of the legacy AB research designer."
requires-python = ">=3.13"
dynamic = ["dependencies"]

[project.scripts]
trialmark = "app.backend.app.evidence.cli:main"

[tool.setuptools.dynamic]
# Metadata comes from requirements.in, but the only sanctioned install path is the
# hash-locked app/backend/requirements.txt (Dockerfile and CI). Locally: pip install -e . --no-deps.
# `pip install -e .` does not exercise package-data; payload correctness is checked only
# by a non-editable build (scripts/check_wheel_payload.py).
dependencies = {file = ["app/backend/requirements.in"]}

[tool.setuptools.packages.find]
where = ["."]
# Top-level distribution name is `app` — a known collision risk with other packages.
# The real import package `trialmark` is the next step, together with the brand rename.
include = ["app*"]
exclude = [
    "app.frontend",
    "app.frontend.*",
    # Kept in the tree for phase G, deliberately absent from the wheel.
    # See app/backend/app/evidence/reserved/README.md.
    "app.backend.app.evidence.reserved",
    "app.backend.app.evidence.reserved.*",
    "app.backend.tests",
    "app.backend.tests.*",
    "app.backend.data",
    ".tmp",
    ".tmp.*",
    "docs-site",
    "docs-site.*",
]
# PEP 420: app/, app/backend/, and app/backend/app/ have no __init__.py.
namespaces = true

[tool.setuptools.package-data]
"app.backend.app.evidence" = ["contracts/schemas/**/*.json"]
"app.backend.app.i18n" = ["*.json"]
"app.backend.templates" = ["*.yaml"]

[tool.setuptools.exclude-package-data]
"*" = [
    "frontend",
    "frontend/*",
    ".tmp",
    ".tmp/*",
    "docs-site",
    "docs-site/*",
    # data/* is currently redundant (package already excluded in packages.find); kept as a second line of defence.
    "data/*",
    "*.sqlite3",
    "*.sqlite3-wal",
    "*.sqlite3-shm",
    ".env",
    "*.env",
]

[tool.mypy]
# Strict static typing gate for the backend application package, on par with the
# RAG_Support / GraceKelly projects. The package is imported as
# `app.backend.app.*` with the repo root on sys.path (PEP 420 namespace
# packages, no __init__.py), so mypy needs the repo root as the package base to
# compute matching module names.
python_version = "3.14"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
files = ["app/backend/app"]
show_error_codes = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# openpyxl ships no type stubs and has no stub package on PyPI; export_service
# uses it only to write .xlsx workbooks. Suppress the missing-import error here
# rather than scattering inline ignores at every call site.
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.ruff]
# Lint gate complementing the mypy --strict gate (run from verify_all). Line
# length (E501) is intentionally NOT enforced: the codebase favours descriptive
# long lines in SQL builders, comments and i18n strings, so enforcing a width
# would be churn without signal. The selected families catch real issues only.
target-version = "py313"  # compatibility floor: local dev runs 3.13; CI/runtime are 3.14

[tool.ruff.lint]
# F  = pyflakes (unused imports/vars, undefined names)
# I  = import ordering (isort)
# B  = flake8-bugbear (likely-bugs: zip-without-strict, mutable defaults, ...)
# C4 = flake8-comprehensions (redundant/clearer comprehensions)
# UP = pyupgrade (modern 3.13 idioms)
select = ["F", "I", "B", "C4", "UP"]
